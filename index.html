<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#173f2a">
    <meta name="description" content="Ajude o sapo do chapéu de palha a atravessar a vila neste jogo de corrida para navegador.">
    <link rel="icon" type="image/png" href="assets/img/start-frog.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
    <title>Sapo do Chapéu de Palha</title>
</head>
<body>
    <main class="game-shell">
        <header class="game-header">
            <div>
                <p class="eyebrow">Aventura na vila</p>
                <h1>Sapo do Chapéu de Palha</h1>
            </div>
            <div class="scoreboard" aria-label="Placar da partida">
                <p><span>Pontos</span><strong id="score">000</strong></p>
                <p><span>Recorde</span><strong id="best-score">000</strong></p>
            </div>
        </header>

        <section class="game-board" id="game-board" aria-label="Área do jogo" tabindex="0">
            <img class="scenery" src="assets/img/cenario.gif" alt="" aria-hidden="true">
            <div class="sun-haze" aria-hidden="true"></div>
            <img class="flying-frog" src="assets/img/duende.gif" alt="" aria-hidden="true">
            <div class="ground" aria-hidden="true"></div>
            <img class="runner" id="runner" src="assets/img/personagem.gif" alt="Sapo de chapéu de palha correndo">
            <img class="obstacle" id="obstacle" src="assets/img/obstaculo.png" alt="Tronco no caminho">

            <div class="game-overlay is-visible" id="game-overlay">
                <div class="overlay-card">
                    <img class="start-frog" src="assets/img/start-frog.png" alt="Sapo do chapéu de palha pronto para correr">
                    <p class="overlay-kicker" id="overlay-kicker">Uma corrida pela vila</p>
                    <h2 id="overlay-title">Pronto para a aventura?</h2>
                    <p class="overlay-message" id="overlay-message">Pule os troncos e tente superar seu recorde.</p>
                    <button class="play-button" id="play-button" type="button" onclick="startGame()">
                        <span class="play-icon" aria-hidden="true">▶</span>
                        <span id="play-label">Jogar agora</span>
                    </button>
                    <p class="controls-hint"><kbd>Espaço</kbd> no computador <span aria-hidden="true">•</span> toque para pular no celular</p>
                </div>
            </div>

            <p class="status" id="game-status" role="status" aria-live="polite"></p>
        </section>

        <div class="mobile-controls">
            <button class="jump-button" id="jump-button" type="button" disabled>
                <span aria-hidden="true">↑</span>
                Pular
            </button>
        </div>
        <p class="desktop-help">Pressione <kbd>Espaço</kbd> ou <kbd>↑</kbd> para pular.</p>
    </main>
</body>
</html>
