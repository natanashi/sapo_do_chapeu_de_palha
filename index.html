<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102d20">
    <meta name="description" content="Ajude o Sapo do Chapéu de Palha a atravessar três regiões, saltar obstáculos e capturar besouros antes que eles se aproximem.">
    <link rel="icon" type="image/png" href="assets/img/sapo-capa.png">
    <link rel="preload" as="image" href="assets/img/cenario-vila.gif">
    <link rel="stylesheet" href="assets/css/style.css?v=6">
    <script src="assets/js/script.js?v=6" defer></script>
    <title>Sapo do Chapéu de Palha — Beta</title>
</head>
<body>
    <main class="game-shell">
        <section class="game-board" id="game-board" aria-label="Área do jogo" tabindex="0">
            <div class="scenery-layer scenery-layer--a is-active" id="scenery-a" aria-hidden="true">
                <span class="scenery-panel"></span>
                <span class="scenery-panel scenery-panel--mirror"></span>
                <span class="scenery-panel"></span>
            </div>
            <div class="scenery-layer scenery-layer--b" id="scenery-b" aria-hidden="true">
                <span class="scenery-panel"></span>
                <span class="scenery-panel scenery-panel--mirror"></span>
                <span class="scenery-panel"></span>
            </div>

            <div class="sun-haze" aria-hidden="true"></div>
            <img class="cloud-frog" src="assets/img/sapo-na-nuvem.gif" alt="" aria-hidden="true">

            <div class="ground" aria-hidden="true">
                <div class="ground-track" id="ground-track">
                    <span class="ground-panel"></span>
                    <span class="ground-panel ground-panel--mirror"></span>
                    <span class="ground-panel"></span>
                </div>
            </div>

            <header class="game-hud">
                <div class="game-title">
                    <p>Sapo do Chapéu de Palha</p>
                    <span id="region-name">Vila do Sol</span>
                </div>
                <div class="scoreboard" aria-label="Placar da partida">
                    <p><span>Pontos</span><strong id="score">000</strong></p>
                    <p><span>Recorde</span><strong id="best-score">000</strong></p>
                    <p class="phase-score"><span>Fase</span><strong id="phase-number">1/3</strong></p>
                    <button class="pause-button" id="pause-button" type="button" disabled aria-label="Pausar jogo">Pausar</button>
                </div>
            </header>

            <div class="platform-layer" id="platform-layer" aria-hidden="true"></div>
            <div class="runner-layer" aria-hidden="true">
                <div class="runner" id="runner"></div>
                <img class="runner-attack" id="runner-attack" src="assets/img/sapo-ataque-lingua.png" alt="">
            </div>
            <div class="obstacle-layer" id="obstacle-layer" aria-hidden="true"></div>
            <div class="collectible-layer" id="collectible-layer" aria-hidden="true"></div>

            <div class="phase-banner" id="phase-banner" aria-hidden="true">
                <span id="phase-kicker">Fase 1</span>
                <strong id="phase-name">Vila do Sol</strong>
            </div>

            <div class="journey-progress" aria-label="Progresso até a próxima fase">
                <span id="journey-progress"></span>
            </div>

            <div class="game-controls" aria-label="Controles do jogo">
                <button class="action-button action-button--jump" id="jump-button" type="button" disabled>
                    <span class="action-symbol" aria-hidden="true">↑</span>
                    <span>Pular <kbd>Espaço</kbd></span>
                </button>
                <button class="action-button action-button--tongue" id="tongue-button" type="button" disabled>
                    <span class="action-symbol" aria-hidden="true">↝</span>
                    <span>Língua <kbd>X</kbd></span>
                </button>
            </div>

            <div class="game-overlay is-visible" id="game-overlay">
                <div class="overlay-card">
                    <img class="start-frog" src="assets/img/sapo-capa.png" alt="Sapo do chapéu de palha pronto para correr">
                    <div class="overlay-copy">
                        <p class="overlay-kicker" id="overlay-kicker">Beta para navegador</p>
                        <h1 id="overlay-title">Uma nova corrida começa aqui</h1>
                        <p class="overlay-message" id="overlay-message">Salte pedras, rodas e javalis, aterrisse nas plataformas e capture os besouros antes que eles encostem no sapo.</p>
                        <button class="play-button" id="play-button" type="button" disabled>
                            <span class="play-icon" aria-hidden="true">▶</span>
                            <span id="play-label">Carregando...</span>
                        </button>
                        <p class="controls-hint"><kbd>Espaço</kbd> pula <span aria-hidden="true">·</span> <kbd>X</kbd> lança a língua <span aria-hidden="true">·</span> <kbd>P</kbd> pausa</p>
                    </div>
                </div>
            </div>

            <p class="status" id="game-status" role="status" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
